name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  OWNER: vhaudiquet

jobs:
  # Fast checks + release build of the Rust workspace.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: https://gitea.com/actions/checkout@v4

      # Installs the toolchain pinned in rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # The crates.io publish order is hand-held in
      # scripts/publish-crates.sh; check it here so a crate that joins
      # the dependency graph without joining the list fails the push,
      # not the tag release.
      - name: Check the crates.io publish order
        run: scripts/publish-crates.sh --check

      # reqwest's default TLS links openssl; rusqlite's bundled SQLite
      # needs a C compiler (present on the runner image, kept explicit
      # next to the rest).
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build (release)
        run: cargo build --release --workspace

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: https://gitea.com/actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      # The offline-suite rule is load-bearing here: no test talks to the
      # network, so the runner needs nothing beyond the toolchain.
      - name: Test
        run: cargo test --workspace --all-features

  # The cloud closure compiles to wasm32: the Durable Object with the
  # worker feature is the real build, and the platform-neutral closure
  # must also stay wasm-clean without the local shell.
  cloudflare-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: https://gitea.com/actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - name: Check the Durable Object build
        run: cargo check -p rhema-cloudflare-code --target wasm32-unknown-unknown --features worker

      - name: Check the platform-neutral closure
        run: cargo check -p rhema-agent-tools -p rhema-subagents -p rhema-cloud-agent -p rhema-cloudflare-code --target wasm32-unknown-unknown --no-default-features
