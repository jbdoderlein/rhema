name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  OWNER: vhaudiquet

jobs:
  # Fast checks + release build of the Rust workspace.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: https://gitea.com/actions/checkout@v4

      # Installs the toolchain pinned in rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # The crates.io publish order is hand-held in
      # .gitea/scripts/publish-crates.sh; check it here so a crate that joins
      # the dependency graph without joining the list fails the push,
      # not the tag release.
      - name: Check the crates.io publish order
        run: .gitea/scripts/publish-crates.sh --check

      # reqwest's default TLS links openssl; rusqlite's bundled SQLite
      # needs a C compiler (present on the runner image, kept explicit
      # next to the rest).
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build (release)
        run: cargo build --release --workspace

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: https://gitea.com/actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      # The offline-suite rule is load-bearing here: no test talks to the
      # network, so the runner needs nothing beyond the toolchain.
      - name: Test
        run: cargo test --workspace --all-features

  # The frontend keeps building for windows: a cross check (no link,
  # so no full mingw toolchain) catches a unix-only regression. ring
  # compiles its C sources even under check, so the target compiler
  # is installed for it.
  windows-check:
    runs-on: ubuntu-latest
    steps:
      - uses: https://gitea.com/actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-gnu

      - name: Install the mingw compiler (ring's build script)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Check the frontend for windows
        run: cargo check -p rhema-code --bins --target x86_64-pc-windows-gnu

  # The published crates the cloud frontend consumes must stay
  # wasm-clean: rhema-cloudflare-code (its own repository) builds its
  # neutral half from rhema-bash, rhema-prompt, rhema-subagents, and
  # rhema-cloud-agent with no default features and no local shell.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: https://gitea.com/actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - name: Check the platform-neutral closure
        run: cargo check -p rhema-bash -p rhema-prompt -p rhema-agent-tools -p rhema-subagents -p rhema-cloud-agent -p rhema-sandbox-http --target wasm32-unknown-unknown --no-default-features

      # The DO also builds rhema-sandbox-http featureless on a native
      # host (its neutral half compiles there): the reqwest code must
      # gate on the feature, not on the target alone. A workspace
      # member's --all-features unification hides exactly this class.
      - name: Check the featureless client on the host
        run: cargo check -p rhema-sandbox-http --no-default-features
