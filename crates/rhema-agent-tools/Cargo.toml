[package]
name = "rhema-agent-tools"
description = "The pre-split agent toolkit, kept as one import path: re-exports rhema-bash (the shell and its see, job, search macros) and rhema-prompt (the template renderer and skill discovery)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rhema-bash = { path = "../rhema-bash", version = "0.3.0", default-features = false }
rhema-prompt = { path = "../rhema-prompt", version = "0.3.0" }

[features]
default = ["local-shell"]
local-shell = ["rhema-bash/local-shell"]

[lints]
workspace = true
